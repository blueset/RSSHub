name: 'Docker Release'

on:
    push:
        branches:
            - migration/pixiv-search-refresh
        paths:
            - '.github/workflows/docker-release.yml'
            - 'lib/**'
            - 'Dockerfile'
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    group: docker-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-26.04-arm
        permissions:
            contents: read
            packages: write
            id-token: write
            attestations: write
        steps:
            - name: Enable ZRAM
              run: |
                  sudo apt-get update -yq
                  sudo apt-get install -yq zram-tools
                  modinfo zram > /dev/null 2>&1 || sudo apt-get install -yq "linux-modules-extra-$(uname -r)"
                  printf 'ALGO=zstd\nPERCENT=100\n' | sudo tee -a /etc/default/zramswap
                  sudo systemctl restart zramswap

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Prepare image name and platform
              id: prepare
              run: |
                  platform="${{ matrix.platform }}"
                  echo "platform-pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
                  echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Chromium image metadata
              id: metadata
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ steps.prepare.outputs.image }}
                  tags: type=sha,format=long,prefix=chromium-bundled-
                  flavor: latest=false

            - name: Build and push Chromium image by digest
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  build-args: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0
                  tags: ${{ steps.prepare.outputs.image }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  platforms: ${{ matrix.platform }}
                  cache-from: type=gha,scope=pixiv-refresh-${{ steps.prepare.outputs.platform-pair }}
                  cache-to: type=gha,mode=max,scope=pixiv-refresh-${{ steps.prepare.outputs.platform-pair }}
                  outputs: type=image,push-by-digest=true,name-canonical=true,push=true

            - name: Attest Chromium image
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-name: ${{ steps.prepare.outputs.image }}
                  subject-digest: ${{ steps.build.outputs.digest }}
                  push-to-registry: true

            - name: Export digest
              run: |
                  mkdir -p "${{ runner.temp }}/digests"
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: digests-${{ steps.prepare.outputs.platform-pair }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        runs-on: ubuntu-latest
        needs: release
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
            id-token: write
            attestations: write
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Download digests
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Publish versioned multi-platform image
              id: publish
              working-directory: ${{ runner.temp }}/digests
              run: |
                  set -euo pipefail
                  image="ghcr.io/${GITHUB_REPOSITORY,,}"
                  tag="$image:chromium-bundled-$GITHUB_SHA"
                  docker buildx imagetools create -t "$tag" $(printf "$image@sha256:%s " *)
                  docker buildx imagetools inspect "$tag"
                  digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
                  echo "image=$image" >> "$GITHUB_OUTPUT"
                  echo "digest=$digest" >> "$GITHUB_OUTPUT"

            - name: Attest multi-platform image
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-name: ${{ steps.publish.outputs.image }}
                  subject-digest: ${{ steps.publish.outputs.digest }}
                  push-to-registry: true
